<!DOCTYPE html>
<html>
<body>
<iframe id='f' src='../index.html' style='width:390px; height:844px;'></iframe>
<script>
window.onload = () => {
  setTimeout(() => {
    try {
      const f = document.getElementById('f');
      const doc = f.contentDocument || f.contentWindow.document;
      const bodyH = doc.body.scrollHeight;
      const womens = doc.getElementById('womens-department');
      const wTop = womens ? womens.offsetTop : null;
      const wCur = doc.getElementById('jacket-women-curiosity');
      const wCurTop = wCur ? wCur.offsetTop : null;
      const wDes = doc.getElementById('jacket-women-desire');
      const wDesTop = wDes ? wDes.offsetTop : null;
      const wAud = doc.getElementById('jacket-women-audacity');
      const wAudTop = wAud ? wAud.offsetTop : null;
      console.log('INFO_HEIGHTS: total=' + bodyH + ', womens_dept=' + wTop + ', wCur=' + wCurTop + ', wDes=' + wDesTop + ', wAud=' + wAudTop);
    } catch(e) {
      console.log('MEASURE_ERR:' + e.message);
    }
  }, 2500);
};
</script>
</body>
</html>
