<!DOCTYPE html>
<html>
<body>
<iframe id='f' src='../index.html' style='width:390px; height:844px;'></iframe>
<script>
window.onload = async () => {
  await new Promise(r => setTimeout(r, 1500));
  const doc = document.getElementById('f').contentDocument;
  
  for (let id of ['jacket-women-curiosity', 'jacket-women-desire', 'jacket-women-audacity', 'jacket-curiosity', 'jacket-desire']) {
    const sec = doc.getElementById(id);
    const grid = sec.querySelector('.gallery-views-grid');
    const cards = grid.querySelectorAll('.gallery-view-card');
    const imgs = Array.from(cards).map(c => c.querySelector('img')?.src.split('/').slice(-2).join('/'));
    console.log(id + ' (cards=' + cards.length + '): ' + imgs.join(', '));
  }
};
</script>
</body>
</html>
